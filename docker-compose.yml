# Production deploy for Albus on the shared Hetzner box.
#
# No ports published — the shared edge Caddy on this box (feierblum-caddy-1,
# part of the feierblum-networking compose stack) reverse-proxies to these
# containers by service name over the shared network below, same pattern as
# ../touch-me, ../TraceRoute, and ../guess-pw. Add the matching site blocks
# to that Caddy's Caddyfile (see caddy/Caddyfile.snippet in this repo).
#
# Usage (manual, on the server):
#   cp .env.example .env   # fill in real values
#   set -a; source .env; set +a
#   docker compose build
#   docker compose up -d
#
# Usage (from a dev machine, builds locally and ships the images — the box
# is low-RAM, same workaround as guess-pw/deploy.ps1): .\deploy.ps1
# This relies on the `image:` tags below matching what deploy.ps1 builds and
# `docker load`s on the server, so `docker compose up -d` there just runs the
# already-loaded images instead of rebuilding.

services:
  chain:
    image: albus-chain:latest
    build:
      context: ./chain
    restart: unless-stopped
    environment:
      INITIAL_BLOCK_DIFFICULTY: ${INITIAL_BLOCK_DIFFICULTY:-5}
      SHARE_DIFFICULTY: ${SHARE_DIFFICULTY:-4}
      TARGET_BLOCK_TIME_MS: ${TARGET_BLOCK_TIME_MS:-30000}
      RETARGET_INTERVAL_BLOCKS: ${RETARGET_INTERVAL_BLOCKS:-20}
      FEE_RATE: ${FEE_RATE:-0.005}
      FALLBACK_MINE_INTERVAL_MS: ${FALLBACK_MINE_INTERVAL_MS:-300000}
    volumes:
      - albus_chain_data:/app/data
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - default
      - edge

  web:
    image: albus-web:latest
    build:
      context: ./web
      args:
        VITE_ALBUS_API_URL: ${VITE_ALBUS_API_URL}
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      - chain
    networks:
      - default
      - edge

volumes:
  albus_chain_data:

networks:
  edge:
    name: feierblum_default
    external: true
