server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    # Downloads fuer den Miner (Ordner kommt per Volume vom Server, siehe docker-compose.yml). Kein Index-Fallback: fehlt eine Datei, 404.
    location /releases/ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
